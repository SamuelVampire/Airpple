<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c6ee47"><title>Airpple · IELTS Writing</title>
<style>
:root{--bg:#f9fbf5;--ink:#171a0b;--muted:#89917c;--mint:#c6ee47;--teal:#8eaf21;--line:#dfe9cf;--card:rgba(255,255,255,.74);--red:#ce4b57}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 12%,rgba(198,238,71,.26) 0%,transparent 37%),radial-gradient(ellipse at 8% 90%,rgba(184,223,58,.13) 0%,transparent 42%),linear-gradient(135deg,#ffffff 0%,#f8fbf4 52%,#eff6e8 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;padding:32px max(24px,6vw) 70px}.wrap{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:14px;font-weight:800;letter-spacing:.14em}.tag{font-size:12px;letter-spacing:.08em;color:var(--muted)}.hero{margin-top:12vh}.hero h1{font-size:clamp(56px,11vw,104px);font-weight:800;letter-spacing:-.065em;margin:0;line-height:1.1}.hero p{font-size:17px;color:#728063;line-height:1.7;max-width:540px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:50px}.stat,.tile,.pane{background:var(--card);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(18px);box-shadow:0 8px 32px rgba(58,75,34,.045);border-radius:22px}.stat{padding:23px}.stat b{font-size:32px;display:block;margin-top:7px}.stat span,.mini{font-size:12px;color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.tile{padding:25px;text-align:left;min-height:165px;transition:transform .2s,background .2s}.tile:hover{transform:translateY(-3px);background:rgba(255,255,255,.9)}.tile h2{font-size:25px;margin:4px 0 10px}.tile p{color:#819078;font-size:14px;line-height:1.6;margin:0}.circle{width:39px;height:39px;border-radius:50%;background:linear-gradient(135deg,#dfff51,#9fda11);display:grid;place-items:center;margin-bottom:20px}.line{height:1px;background:#769a413b;margin:25px 0}.back{border:0;background:none;padding:10px 0;color:#566833}.pane{padding:clamp(22px,5vw,48px);margin-top:6vh}.studyhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.06em}.progress{height:5px;background:rgba(198,238,71,.2);border-radius:20px;overflow:hidden;margin-top:18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#a7e118,#587500);transition:width .25s}.prompt{text-align:center;padding:65px 0 30px}.prompt h1{font-size:clamp(31px,6vw,52px);font-weight:750;margin:15px 0}.prompt small{color:var(--muted);line-height:1.8}.spellinput{display:block;width:100%;border:0;border-bottom:2px solid #789a22;background:transparent;outline:0;font-size:clamp(23px,4vw,35px);font-weight:650;padding:18px 4px;color:var(--ink);border-radius:0}.spellinput:focus{border-color:#476300}.primary{border:0;background:linear-gradient(110deg,#c5f43d,#8bbd11);color:#1a2600;border-radius:14px;padding:14px 25px;font-weight:750}.primary:disabled{opacity:.4}.actions{display:flex;justify-content:flex-end;margin-top:26px}.feedback{margin-top:19px;padding:20px;border-radius:14px;background:rgba(238,249,204,.68);line-height:1.7}.feedback.bad{background:#ffe7df}.feedback strong{display:block;color:#466800}.feedback.bad strong{color:#a7293b}.feedback .answer{font-size:24px;font-weight:750;overflow-wrap:anywhere}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:24px}.pill{padding:10px 15px;border:1px solid #d5e3ba;background:rgba(255,255,255,.65);border-radius:50px;font-size:13px}.pill.on{background:#a6d91d;border-color:#a6d91d}.muted{color:var(--muted)}.empty{text-align:center;padding:50px 12px}.empty h2{font-size:34px}.footer{font-size:12px;color:#87917b;margin-top:40px}.list{display:grid;gap:10px;margin-top:22px}.item{background:rgba(255,255,255,.72);border-radius:14px;padding:15px 19px;display:flex;justify-content:space-between;gap:15px;align-items:center}.item b{font-size:16px}.item small{color:#86927c;display:block;margin-top:5px}.filter{border:1px solid #d6e3c0;border-radius:10px;background:rgba(255,255,255,.9);padding:9px;width:100%;max-width:320px;margin:10px 0}a{color:#405900}@media(max-width:560px){.stats{gap:8px}.stat{padding:15px}.stat b{font-size:23px}.tiles{grid-template-columns:1fr}.tile{min-height:125px}.hero{margin-top:9vh}.hero p{font-size:15px}.pane{margin-top:30px}.prompt{padding:46px 0 20px}.item{align-items:flex-start;flex-direction:column}}

/* Pêche-inspired full-screen home on iPad and desktop. */
body:has(.home-screen) .app{padding:clamp(16px,2.5vh,28px) max(22px,5vw);}
body:has(.home-screen) .wrap{max-width:1250px;}
body:has(.home-screen) .top{display:none;}
.home-screen{min-height:calc(100vh - 56px);min-height:calc(100dvh - 2 * clamp(16px,2.5vh,28px));display:flex;flex-direction:column}
.home-title-area{flex:1;min-height:145px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:18px 0 28px}
.home-title-area h1{font-size:clamp(56px,7.5vw,92px);font-weight:800;letter-spacing:-.06em;line-height:1.1;margin:0 0 25px}
.home-title-area p{font-size:12px;font-weight:650;letter-spacing:.19em;color:#8c9581;margin:0 0 9px}
.home-title-area small{font-size:13px;color:#919d87}
.home-bottom{width:100%;margin-top:auto}
.home-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.home-card{min-width:0;min-height:129px;border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:26px 24px;text-align:left;background:rgba(255,255,255,.73);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 28px rgba(50,70,31,.04);display:flex;flex-direction:column;align-items:flex-start}
.home-card:hover{background:rgba(255,255,255,.94)}
.home-card:focus-visible{outline:2px solid #92b92e;outline-offset:3px}
.home-card b{font-size:clamp(19px,2.2vw,26px);letter-spacing:-.03em;white-space:nowrap}
.home-card kbd{font:inherit;margin-left:clamp(5px,1vw,14px)}
.home-card span{font-size:22px;color:#759c22;margin-top:9px}
.home-footnote{margin-top:17px;font-size:11px;color:#939c89;text-align:right}
@media(max-width:850px){.home-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.home-card{padding:18px 21px;min-height:102px}.home-card span{margin-top:5px}.home-title-area{padding-bottom:15px}}
@media(max-width:550px){.home-title-area h1{font-size:clamp(49px,14vw,66px);margin-bottom:14px}.home-title-area p{font-size:10px;letter-spacing:.1em}.home-title-area small{font-size:12px}.home-card{padding:15px;min-height:96px}.home-card b{font-size:19px}.home-card kbd{margin-left:5px}.home-card span{font-size:19px}.home-footnote{font-size:10px;margin-top:9px}}
@media(max-height:520px) and (min-width:650px){.home-title-area{min-height:100px;padding:4px 0 10px}.home-title-area h1{font-size:48px;margin-bottom:9px}.home-card{min-height:80px;padding:12px 15px}.home-footnote{margin-top:8px}}

/* 2026-10-24: three Pêche-style modules, lifted into the lower-middle of the viewport. */
.home-screen{
  display:grid;
  grid-template-rows:minmax(0,1.6fr) auto minmax(0,.8fr);
}
.home-title-area{
  flex:none;
  min-height:0;
  align-self:center;
  padding:12px 0 22px;
}
.home-bottom{margin-top:0;align-self:start;}
.home-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}
.home-card{min-height:135px;}

/* Frosted white glass, consistent between the home and inner study/library views. */
:root{--card:rgba(255,255,255,.53);--glass-border:rgba(255,255,255,.76);}
.home-card,.pane,.stat,.tile,.item,.filter,.pill,.feedback{
  background:rgba(255,255,255,.53);
  border:1px solid var(--glass-border);
  -webkit-backdrop-filter:blur(18px) saturate(115%);
  backdrop-filter:blur(18px) saturate(115%);
  box-shadow:0 9px 30px rgba(57,75,31,.055),inset 0 1px 0 rgba(255,255,255,.42);
}
.home-card:hover,.tile:hover{background:rgba(255,255,255,.68);}
.feedback{background:rgba(247,252,234,.55);}
.feedback.bad{background:rgba(255,241,237,.6);}
.pill.on{background:rgba(198,238,71,.43);border-color:rgba(132,169,45,.3);}
.filter:focus-visible,.pill:focus-visible{outline:2px solid #91b72e;outline-offset:2px;}
@media(max-width:850px){
  .home-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .home-card{min-height:116px;padding:19px 16px;}
  .home-card b{font-size:clamp(16px,2.7vw,23px);}
}
@media(max-width:550px){
  .home-screen{grid-template-rows:minmax(0,1.2fr) auto minmax(0,.35fr);}
  .home-actions{grid-template-columns:1fr;gap:10px;}
  .home-card{min-height:78px;padding:12px 19px;}
  .home-card b{font-size:20px;}
  .home-card span{margin-top:3px;}
}
@media(max-height:550px){
  .home-screen{grid-template-rows:minmax(0,1fr) auto minmax(0,.15fr);}
  .home-title-area h1{margin-bottom:10px;}
  .home-card{min-height:72px;padding:10px 15px;}
}
</style></head><body><div class="app"><div class="wrap"><div class="top"><div class="brand">AIRPPLE <span style="color:#608100">✳</span></div><div class="tag">IELTS WRITING · SPELLING</div></div><main id="root"></main></div></div><script src="./phrases.js"></script><script>
const WORDS=(window.AIRPPLE_PHRASES||[]).map((w,i)=>({...w,id:w.en.toLowerCase()}));const KEY="airpple-progress-v1",SESS="airpple-session-v1";const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let progress={},session=null,sessions={},mode="home",filter="All";
try{progress=JSON.parse(localStorage.getItem(KEY))||{}}catch{}try{sessions=JSON.parse(localStorage.getItem("airpple-sessions-v2"))||{}}catch{}try{session=JSON.parse(localStorage.getItem(SESS))||null;if(session?.type&&session.queue?.length&&!sessions[session.type])sessions[session.type]=session}catch{}
const speechSupported=typeof speechSynthesis!=="undefined";function speak(word){if(!speechSupported||!word)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang="en-GB";u.rate=.86;const voices=speechSynthesis.getVoices();const british=voices.find(v=>/^en-GB$/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(british)u.voice=british;speechSynthesis.speak(u)}catch(e){console.warn("Speech unavailable",e)}}const save=()=>{if(session?.type)sessions[session.type]=session;localStorage.setItem(KEY,JSON.stringify(progress));localStorage.setItem("airpple-sessions-v2",JSON.stringify(sessions));localStorage.setItem(SESS,JSON.stringify(session))};const state=w=>progress[w.id]||{interval:0,due:0,learned:false,attempts:0,mistakes:0};const now=()=>Date.now();const shuffle=a=>a.slice().sort(()=>Math.random()-.5);const cats=()=>["All",...new Set(WORDS.map(w=>w.category))];const due=()=>WORDS.filter(w=>state(w).learned&&state(w).due<=now());
function home(){if(session?.type)save();mode="home";let count=WORDS.filter(w=>!state(w).learned).length;let d=due().length;let cards=[["Spelling","S",count,"start('new')"],["Review","R",d,"start('review')"],["Library","L",WORDS.length,"library()"]];$("#root").innerHTML='<div class="home-screen"><div class="home-title-area"><h1>Airpple</h1><p>YOUR WRITING, YOUR VOCABULARY</p><small>IELTS Writing · Spelling &amp; Review</small></div><div class="home-bottom"><div class="home-actions">'+cards.map(c=>'<button class="home-card" aria-keyshortcuts="'+c[1]+'" onclick="'+c[3]+'"><b>'+c[0]+' <kbd>'+c[1]+'</kbd></b><span>'+c[2]+'</span></button>').join("")+'</div><div class="home-footnote">Spelling · 错题循环 · 间隔复习</div></div></div>'}
function start(type){if(type!=="new"&&type!=="review")return;if(session?.type)save();session=sessions[type]||null;if(session&&session.queue?.length){session.queue=session.queue.filter(x=>WORDS.some(w=>w.id===x.id));if(session.queue.length){session.current=Math.min(session.current||0,session.queue.length-1);mode="study";save();render();return}}session=null;let pool=type==="review"?due().sort((a,b)=>state(a).due-state(b).due):WORDS.filter(w=>!state(w).learned);if(!pool.length){mode="empty";$("#root").innerHTML='<div class="pane empty"><h2>All caught up ✳</h2><p class="muted">这个模式暂时没有待练词组。</p><button class="primary" onclick="home()">Back home</button></div>';return}pool=type==="review"?pool.slice(0,25):shuffle(pool).slice(0,25);session={type,queue:pool.map(w=>({id:w.id,streak:0,wrong:false})),current:0,total:pool.length,completed:0,phase:"typing",value:"",result:null};sessions[type]=session;save();mode="study";render()}
function current(){return session&&WORDS.find(w=>w.id===session.queue[session.current]?.id)}
function render(){if(!session||!session.queue.length){finish();return}let w=current();if(!w){session.queue.splice(session.current,1);session.current=0;save();render();return}let reviewed=session.completed,percent=Math.round(100*reviewed/session.total),reveal=session.phase==="result";$("#root").innerHTML='<button class="back" onclick="home()">← Back</button><div class="pane"><div class="studyhead"><span>'+esc(session.type==="review"?"REVIEW":"SPELLING")+' · '+esc(w.category)+'</span><span>'+reviewed+' / '+session.total+'</span></div><div class="progress"><i style="width:'+percent+'%"></i></div><div class="prompt"><div class="mini">WRITE THE ENGLISH PHRASE</div><h1>'+esc(w.zh)+'</h1><small>Tab 重播发音 · Enter 检查 / 下一题 · 答案页也可以按 Space</small><div class="controls" style="justify-content:center"><button type="button" class="pill" id="sound" aria-label="播放英文发音">◖)) Listen · Tab</button></div></div><form id="form"><input id="spell" class="spellinput" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="英文词组拼写" value="'+(reveal?esc(w.en):esc(session.value||""))+'"><div id="feedback">'+feedback(w)+'</div><div class="actions"><button class="primary" type="submit">'+(reveal?"Next →":"Check →")+'</button></div></form><div class="footer">两次拼对 · 答错重写 · 进度自动保存 · 允许完整词组及空格</div></div>';$("#sound").onclick=()=>speak(w.en);$("#form").onsubmit=e=>{e.preventDefault();session.phase==="result"?next():check()};let input=$("#spell");if(reveal){input.disabled=true;$("#form button[type=submit]").focus()}else{input.focus();input.setSelectionRange(input.value.length,input.value.length);input.oninput=()=>{session.value=input.value;session.result=null;$("#feedback").innerHTML="";save()}}speak(w.en)}
function feedback(w){if(!session.result)return"";let good=session.result.good;return '<div class="feedback '+(good?"":"bad")+'"><strong>'+(good?"Correct ✓":"Not quite · spell it again")+'</strong><div class="answer">'+esc(w.en)+'</div><div class="mini">'+esc(w.zh)+'</div>'+(good&&session.result.streak===1?'<div class="mini">第一次拼对，稍后还会出现一次。</div>':"")+'</div>'}
const norm=s=>s.trim().replace(/\s+/g," ").toLowerCase().replace(/[’‘]/g,"'");function check(){let w=current(),item=session.queue[session.current],input=$("#spell").value;session.value=input;if(!input.trim())return;if(norm(input)!==norm(w.en)){item.wrong=true;item.streak=0;session.result={good:false};session.phase="typing";let p=state(w);{p.mistakes++;p.attempts++;progress[w.id]=p}session.value="";save();render();return}item.streak++;session.result={good:true,streak:item.streak};session.phase="result";save();render()}
function next(){let item=session.queue[session.current],w=current();if(item.streak>=2){{let p=state(w);p.learned=true;p.attempts++;p.interval=session.type==="review"?(item.wrong?10/1440:Math.max(1,(p.interval||.5)*2.2)):.5;p.due=now()+p.interval*86400000;progress[w.id]=p}session.queue.splice(session.current,1);session.completed++}else {session.current=(session.current+1)%session.queue.length}if(session.current>=session.queue.length)session.current=0;session.phase="typing";session.value="";session.result=null;save();if(!session.queue.length)finish();else render()}
function finish(){const completed=session?.completed||0;if(session?.type)delete sessions[session.type];session=null;save();$("#root").innerHTML='<div class="pane empty"><div class="tag">SESSION COMPLETE</div><h2>Beautifully done. ✳</h2><p class="muted">'+completed+' 个词组完成本轮训练。</p><button class="primary" onclick="home()">Back home</button></div>'}
function library(){if(session?.type)save();mode="library";let list=filter==="All"?WORDS:WORDS.filter(w=>w.category===filter);$("#root").innerHTML='<button class="back" onclick="home()">← Back</button><div class="hero" style="margin-top:6vh"><div class="tag">YOUR PERSONAL DATABASE</div><h1 style="font-size:56px">Library.</h1><p>'+WORDS.length+' phrases · From Notion writing summary</p></div><select class="filter" id="filter">'+cats().map(c=>'<option '+(filter===c?"selected":"")+'>'+esc(c)+'</option>').join("")+'</select><div class="list">'+list.map(w=>'<div class="item"><div><b>'+esc(w.en)+'</b><small>'+esc(w.zh)+'</small></div><span class="mini">'+(state(w).learned?"✓ Learned":esc(w.category))+'</span></div>').join("")+'</div>';$("#filter").onchange=e=>{filter=e.target.value;library()}}
document.addEventListener("keydown",e=>{if(!session||mode!=="study"){if(e.altKey||e.ctrlKey||e.metaKey||e.target.matches("input,textarea,select"))return;if(e.key.toLowerCase()==="s")start("new");if(e.key.toLowerCase()==="r")start("review");if(e.key.toLowerCase()==="l")library();return}if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();speak(current()?.en);return}if(session.phase==="result"&&(e.key==="Enter"||e.key===" ")){e.preventDefault();next();return}if(e.key==="Escape"){e.preventDefault();home()}});home();
</script></body></html>
