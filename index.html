<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dcf4ed"><title>Airpple · IELTS Writing</title>
<style>
:root{--bg:#edf8f4;--ink:#203e39;--muted:#849b96;--mint:#a4e4d3;--teal:#36a997;--line:#d7e8e2;--card:rgba(255,255,255,.67);--red:#df7776}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 8%,#a1e5d9 0%,transparent 38%),radial-gradient(ellipse at 8% 92%,#b4e0f0 0%,transparent 42%),linear-gradient(135deg,#f6fbf9,#e0f4ea);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;padding:32px max(24px,6vw) 70px}.wrap{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:14px;font-weight:800;letter-spacing:.14em}.tag{font-size:12px;letter-spacing:.08em;color:var(--muted)}.hero{margin-top:12vh}.hero h1{font-size:clamp(56px,11vw,104px);font-weight:800;letter-spacing:-.065em;margin:0;line-height:1.1}.hero p{font-size:17px;color:#698780;line-height:1.7;max-width:540px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:50px}.stat,.tile,.pane{background:var(--card);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(18px);box-shadow:0 8px 32px #24776d0a;border-radius:22px}.stat{padding:23px}.stat b{font-size:32px;display:block;margin-top:7px}.stat span,.mini{font-size:12px;color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.tile{padding:25px;text-align:left;min-height:165px;transition:transform .2s,background .2s}.tile:hover{transform:translateY(-3px);background:#fff9}.tile h2{font-size:25px;margin:4px 0 10px}.tile p{color:#78918c;font-size:14px;line-height:1.6;margin:0}.circle{width:39px;height:39px;border-radius:50%;background:linear-gradient(135deg,#a1e9d1,#69c7c4);display:grid;place-items:center;margin-bottom:20px}.line{height:1px;background:#8cbdb43b;margin:25px 0}.back{border:0;background:none;padding:10px 0;color:#6b8a84}.pane{padding:clamp(22px,5vw,48px);margin-top:6vh}.studyhead{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.06em}.progress{height:5px;background:#cde5dd;border-radius:20px;overflow:hidden;margin-top:18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#74cbb1,#46b5ae);transition:width .25s}.prompt{text-align:center;padding:65px 0 30px}.prompt h1{font-size:clamp(31px,6vw,52px);font-weight:750;margin:15px 0}.prompt small{color:var(--muted);line-height:1.8}.spellinput{display:block;width:100%;border:0;border-bottom:2px solid #80cbbb;background:transparent;outline:0;font-size:clamp(23px,4vw,35px);font-weight:650;padding:18px 4px;color:var(--ink);border-radius:0}.spellinput:focus{border-color:#278f7f}.primary{border:0;background:linear-gradient(110deg,#72cdb4,#55bcbc);color:#163e37;border-radius:14px;padding:14px 25px;font-weight:750}.primary:disabled{opacity:.4}.actions{display:flex;justify-content:flex-end;margin-top:26px}.feedback{margin-top:19px;padding:20px;border-radius:14px;background:#ffffffa8;line-height:1.7}.feedback.bad{background:#fff1ee}.feedback strong{display:block;color:#237e6e}.feedback.bad strong{color:#ba5758}.feedback .answer{font-size:24px;font-weight:750;overflow-wrap:anywhere}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:24px}.pill{padding:10px 15px;border:1px solid #afd3c9;background:#ffffff90;border-radius:50px;font-size:13px}.pill.on{background:#75cbb5;border-color:#75cbb5}.muted{color:var(--muted)}.empty{text-align:center;padding:50px 12px}.empty h2{font-size:34px}.footer{font-size:12px;color:#819e98;margin-top:40px}.list{display:grid;gap:10px;margin-top:22px}.item{background:#ffffff92;border-radius:14px;padding:15px 19px;display:flex;justify-content:space-between;gap:15px;align-items:center}.item b{font-size:16px}.item small{color:#89a39c;display:block;margin-top:5px}.filter{border:1px solid #b3d6ca;border-radius:10px;background:#fff9;padding:9px;width:100%;max-width:320px;margin:10px 0}a{color:#398e82}@media(max-width:560px){.stats{gap:8px}.stat{padding:15px}.stat b{font-size:23px}.tiles{grid-template-columns:1fr}.tile{min-height:125px}.hero{margin-top:9vh}.hero p{font-size:15px}.pane{margin-top:30px}.prompt{padding:46px 0 20px}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><div class="wrap"><div class="top"><div class="brand">AIRPPLE <span style="color:#5caea3">✳</span></div><div class="tag">IELTS WRITING · SPELLING</div></div><main id="root"></main></div></div><script src="./phrases.js"></script><script>
const WORDS=(window.AIRPPLE_PHRASES||[]).map((w,i)=>({...w,id:w.en.toLowerCase()}));const KEY="airpple-progress-v1",SESS="airpple-session-v1";const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let progress={},session=null,mode="home",filter="All";
try{progress=JSON.parse(localStorage.getItem(KEY))||{}}catch{}try{session=JSON.parse(localStorage.getItem(SESS))||null}catch{}
const save=()=>{localStorage.setItem(KEY,JSON.stringify(progress));localStorage.setItem(SESS,JSON.stringify(session))};const state=w=>progress[w.id]||{interval:0,due:0,learned:false,attempts:0,mistakes:0};const now=()=>Date.now();const shuffle=a=>a.slice().sort(()=>Math.random()-.5);const cats=()=>["All",...new Set(WORDS.map(w=>w.category))];const due=()=>WORDS.filter(w=>state(w).learned&&state(w).due<=now());
function home(){mode="home";let done=WORDS.filter(w=>state(w).learned).length;$("#root").innerHTML='<section class="hero"><div class="tag">YOUR WRITING, YOUR VOCABULARY</div><h1>Spell it.<br>Own it.</h1><p>把写过的作文变成真正会用的表达。一个词组，两次拼对；记不住的，下一轮再见。</p></section><div class="stats"><div class="stat"><span>PHRASES</span><b>'+WORDS.length+'</b></div><div class="stat"><span>LEARNED</span><b>'+done+'</b></div><div class="stat"><span>DUE TODAY</span><b>'+due().length+'</b></div></div><div class="tiles"><button class="tile" onclick="start(\'new\')"><div class="circle">✎</div><h2>Spelling</h2><p>中文提示 → 输入完整英文词组<br>连续正确两次才算掌握</p></button><button class="tile" onclick="start(\'review\')"><div class="circle">↻</div><h2>Review <span style="color:#369b8e">'+due().length+'</span></h2><p>按到期时间复习<br>忘记的表达更早回来</p></button><button class="tile" onclick="library()"><div class="circle">▤</div><h2>Library</h2><p>查看作文表达与来源<br>按主题筛选词组</p></button><button class="tile" onclick="start(\'all\')"><div class="circle">∞</div><h2>Free practice</h2><p>全部词组随机拼写<br>不改变正式复习排期</p></button></div><div class="footer">Based on your writing notes · Inspired by Pêche · Progress stored in this browser</div>'}
function start(type){if(session&&session.type===type&&session.queue.length){mode="study";render();return}let pool=type==="review"?due().sort((a,b)=>state(a).due-state(b).due):type==="new"?WORDS.filter(w=>!state(w).learned):WORDS;if(!pool.length){mode="empty";$("#root").innerHTML='<div class="pane empty"><h2>All caught up ✳</h2><p class="muted">这个模式暂时没有待练词组。</p><button class="primary" onclick="home()">Back home</button></div>';return}pool=type==="review"?pool.slice(0,25):shuffle(pool).slice(0,25);session={type,queue:pool.map(w=>({id:w.id,streak:0,wrong:false})),current:0,total:pool.length,completed:0,phase:"typing",value:"",result:null};save();mode="study";render()}
function current(){return session&&WORDS.find(w=>w.id===session.queue[session.current]?.id)}
function render(){if(!session||!session.queue.length){finish();return}let w=current();if(!w){session.queue.splice(session.current,1);session.current=0;save();render();return}let reviewed=session.completed,percent=Math.round(100*reviewed/session.total);$("#root").innerHTML='<button class="back" onclick="home()">← Back</button><div class="pane"><div class="studyhead"><span>'+esc(session.type==="review"?"REVIEW":session.type==="all"?"FREE PRACTICE":"SPELLING")+' · '+esc(w.category)+'</span><span>'+reviewed+' / '+session.total+'</span></div><div class="progress"><i style="width:'+percent+'%"></i></div><div class="prompt"><div class="mini">WRITE THE ENGLISH PHRASE</div><h1>'+esc(w.zh)+'</h1><small>请输入完整的英文词组，包含空格和必要的标点。</small></div><form id="form"><input id="spell" class="spellinput" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="英文词组拼写" value="'+esc(session.value||"")+'"><div id="feedback">'+feedback(w)+'</div><div class="actions"><button class="primary" type="submit">'+(session.phase==="result"?"Next →":"Check →")+'</button></div></form><div class="footer">Enter 检查 · 答错需重新拼对 · 返回主页会保存当前进度</div></div>';$("#form").onsubmit=e=>{e.preventDefault();session.phase==="result"?next():check()};let input=$("#spell");if(session.phase==="result")input.disabled=true;else {input.focus();input.setSelectionRange(input.value.length,input.value.length);input.oninput=()=>{session.value=input.value;save()}}}
function feedback(w){if(!session.result)return"";let good=session.result.good;return '<div class="feedback '+(good?"":"bad")+'"><strong>'+(good?"Correct ✓":"Not quite · spell it again")+'</strong><div class="answer">'+esc(w.en)+'</div><div class="mini">'+esc(w.zh)+'</div>'+(good&&session.result.streak===1?'<div class="mini">第一次拼对，稍后还会出现一次。</div>':"")+'</div>'}
const norm=s=>s.trim().replace(/\s+/g," ").toLowerCase().replace(/[’‘]/g,"'");function check(){let w=current(),item=session.queue[session.current],input=$("#spell").value;session.value=input;if(!input.trim())return;if(norm(input)!==norm(w.en)){item.wrong=true;item.streak=0;session.result={good:false};session.phase="typing";let p=state(w);if(session.type!=="all"){p.mistakes++;p.attempts++;progress[w.id]=p}save();render();return}item.streak++;session.result={good:true,streak:item.streak};session.phase="result";save();render()}
function next(){let item=session.queue[session.current],w=current();if(item.streak>=2){if(session.type!=="all"){let p=state(w);p.learned=true;p.attempts++;p.interval=session.type==="review"?(item.wrong?0.5:Math.max(1,(p.interval||.5)*2.2)):.5;p.due=now()+p.interval*86400000;progress[w.id]=p}session.queue.splice(session.current,1);session.completed++}else {session.current=(session.current+1)%session.queue.length}if(session.current>=session.queue.length)session.current=0;session.phase="typing";session.value="";session.result=null;save();if(!session.queue.length)finish();else render()}
function finish(){const completed=session?.completed||0;session=null;save();$("#root").innerHTML='<div class="pane empty"><div class="tag">SESSION COMPLETE</div><h2>Beautifully done. ✳</h2><p class="muted">'+completed+' 个词组完成本轮训练。</p><button class="primary" onclick="home()">Back home</button></div>'}
function library(){mode="library";let list=filter==="All"?WORDS:WORDS.filter(w=>w.category===filter);$("#root").innerHTML='<button class="back" onclick="home()">← Back</button><div class="hero" style="margin-top:6vh"><div class="tag">YOUR PERSONAL DATABASE</div><h1 style="font-size:56px">Library.</h1><p>'+WORDS.length+' phrases · From Notion writing summary</p></div><select class="filter" id="filter">'+cats().map(c=>'<option '+(filter===c?"selected":"")+'>'+esc(c)+'</option>').join("")+'</select><div class="list">'+list.map(w=>'<div class="item"><div><b>'+esc(w.en)+'</b><small>'+esc(w.zh)+'</small></div><span class="mini">'+(state(w).learned?"✓ Learned":esc(w.category))+'</span></div>').join("")+'</div>';$("#filter").onchange=e=>{filter=e.target.value;library()}}
home();
</script></body></html>
